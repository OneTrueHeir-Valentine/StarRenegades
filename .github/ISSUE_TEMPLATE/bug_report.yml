name: Bug report
description: Report a problem with the mod or a combat forecast.
title: ""
body:
  - type: input
    id: version
    attributes:
      label: Game and mod versions
      placeholder: Steam 1.5.1.5, Bugfix 0.1.2 or Rebalance 0.3.1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can it be reproduced?
      description: For forecasts, include characters, enemies, attacks, equipment and active effects if you remember them. Screenshots are welcome.
  - type: textarea
    id: log
    attributes:
      label: Mod log
      description: Paste SRBugfix/bugfix.log or SRRebalance/rebalance.log from the game folder. Remove any personal paths before posting.
      render: text
